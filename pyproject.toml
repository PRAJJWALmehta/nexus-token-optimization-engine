[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-token-optimization"
version = "0.1.0"
description = "Nexus Token-Optimization Gateway — transparent OpenAI-compatible reverse proxy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    # Semantic caching
    "sentence-transformers>=3.0.0",
    "redis[hiredis]>=5.0.0",
    "numpy>=1.26.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
